<ul z-sidebar-menu>
  <li z-sidebar-menu-item>
    <button z-sidebar-menu-button z-dropdown [zDropdownMenu]="teamMenu" class="w-fit px-1.5">
      <div
        class="bg-sidebar-primary text-sidebar-primary-foreground flex aspect-square size-5 items-center justify-center rounded-md"
      >
        <ng-icon [name]="activeTeam()?.logo ?? ''" class="size-3" />
      </div>
      <span class="truncate font-medium">{{ activeTeam()?.name }}</span>
      <ng-icon name="lucideChevronDown" class="opacity-50" />
    </button>

    <z-dropdown-menu-content #teamMenu="zDropdownMenuContent" class="w-64 rounded-lg">
      <z-dropdown-menu-label class="text-muted-foreground text-xs">Teams</z-dropdown-menu-label>

      @for (team of teams(); track team.name; let index = $index) {
        <z-dropdown-menu-item class="gap-2 p-2" (click)="selectedTeam.set(team)">
          <div class="flex size-6 items-center justify-center rounded-xs border">
            <ng-icon [name]="team.logo" class="size-4 shrink-0" />
          </div>
          {{ team.name }}
          <z-dropdown-menu-shortcut>⌘{{ index + 1 }}</z-dropdown-menu-shortcut>
        </z-dropdown-menu-item>
      }

      <z-dropdown-menu-separator />

      <z-dropdown-menu-item class="gap-2 p-2">
        <div class="bg-background flex size-6 items-center justify-center rounded-md border">
          <ng-icon name="lucidePlus" class="size-4" />
        </div>
        <div class="text-muted-foreground font-medium">Add team</div>
      </z-dropdown-menu-item>
    </z-dropdown-menu-content>
  </li>
</ul>
