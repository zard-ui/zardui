<z-card class="gap-2 py-4 shadow-none">
  <div z-card-header class="px-4">
    <z-card-title zTitle="Subscribe to our newsletter" class="text-sm" />
    <z-card-description zDescription="Opt-in to receive updates and news about the sidebar." />
  </div>

  <div z-card-content class="px-4">
    <form>
      <div class="grid gap-2.5">
        <input z-input z-sidebar-input type="email" placeholder="Email" />

        <button z-button zSize="sm" class="bg-sidebar-primary text-sidebar-primary-foreground w-full shadow-none">
          Subscribe
        </button>
      </div>
    </form>
  </div>
</z-card>
