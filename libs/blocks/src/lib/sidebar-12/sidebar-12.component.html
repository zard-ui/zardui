<z-sidebar-provider>
  <lib-sidebar-12-app-sidebar />

  <main z-sidebar-inset>
    <header class="bg-background sticky top-0 flex h-16 shrink-0 items-center gap-2 border-b px-4">
      <button z-sidebar-trigger class="-ml-1" aria-label="Toggle Sidebar"></button>

      <z-separator zOrientation="vertical" class="mr-2 data-[orientation=vertical]:h-4" />

      <z-breadcrumb>
        <z-breadcrumb-item>
          <span z-breadcrumb-page>October 2024</span>
        </z-breadcrumb-item>
      </z-breadcrumb>
    </header>

    <div class="flex flex-1 flex-col gap-4 p-4">
      <div class="grid auto-rows-min gap-4 md:grid-cols-5">
        @for (cell of placeholders; track cell) {
          <div class="bg-muted/50 aspect-square rounded-xl"></div>
        }
      </div>
    </div>
  </main>
</z-sidebar-provider>
