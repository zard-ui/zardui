<z-sidebar zVariant="floating">
  <div z-sidebar-header>
    <ul z-sidebar-menu>
      <li z-sidebar-menu-item>
        <a z-sidebar-menu-button zSize="lg" href="#">
          <div
            class="bg-sidebar-primary text-sidebar-primary-foreground flex aspect-square size-8 items-center justify-center rounded-lg"
          >
            <ng-icon name="lucideGalleryVerticalEnd" class="size-4" />
          </div>
          <div class="flex flex-col gap-0.5 leading-none">
            <span class="font-medium">Documentation</span>
            <span>v1.0.0</span>
          </div>
        </a>
      </li>
    </ul>
  </div>

  <z-sidebar-content>
    <div z-sidebar-group>
      <ul z-sidebar-menu class="gap-2">
        @for (group of navMain; track group.title) {
          <li z-sidebar-menu-item>
            <a z-sidebar-menu-button [href]="group.url" class="font-medium">{{ group.title }}</a>

            @if (group.items.length) {
              <ul z-sidebar-menu-sub class="ml-0 border-l-0 px-1.5">
                @for (item of group.items; track item.title) {
                  <li z-sidebar-menu-sub-item>
                    <a z-sidebar-menu-sub-button [href]="item.url" [zActive]="!!item.isActive">{{ item.title }}</a>
                  </li>
                }
              </ul>
            }
          </li>
        }
      </ul>
    </div>
  </z-sidebar-content>
</z-sidebar>
