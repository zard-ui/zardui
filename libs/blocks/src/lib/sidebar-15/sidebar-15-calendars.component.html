@for (calendar of calendars(); track calendar.name; let groupIndex = $index) {
  <div z-sidebar-group class="py-0">
    <div z-collapsible class="group/collapsible" [zOpen]="groupIndex === 0">
      <button
        z-collapsible-trigger
        z-sidebar-group-label
        class="group/label text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground w-full text-sm"
      >
        {{ calendar.name }}
        <ng-icon
          name="lucideChevronRight"
          class="ml-auto transition-transform group-data-[state=open]/collapsible:rotate-90"
        />
      </button>

      <z-collapsible-content>
        <div z-sidebar-group-content>
          <ul z-sidebar-menu>
            @for (item of calendar.items; track item; let itemIndex = $index) {
              <li z-sidebar-menu-item>
                <button z-sidebar-menu-button>
                  <div
                    [attr.data-active]="itemIndex < 2"
                    class="group/calendar-item border-sidebar-border text-sidebar-primary-foreground data-[active=true]:border-sidebar-primary data-[active=true]:bg-sidebar-primary flex aspect-square size-4 shrink-0 items-center justify-center rounded-sm border"
                  >
                    <!-- `hidden!`/`block!`: NgIcon's host `display` is declared outside any cascade
                         layer, so unprefixed display utilities cannot override it. -->
                    <ng-icon name="lucideCheck" class="hidden! size-3 group-data-[active=true]/calendar-item:block!" />
                  </div>
                  {{ item }}
                </button>
              </li>
            }
          </ul>
        </div>
      </z-collapsible-content>
    </div>
  </div>

  <z-sidebar-separator class="mx-0" />
}
