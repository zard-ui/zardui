<header class="bg-background sticky top-0 z-50 w-full">
  <nav class="container-wrapper 3xl:fixed:px-0 px-6">
    <menu class="3xl:fixed:container flex h-(--header-height) items-center gap-2">
      <a class="hidden items-center gap-3 lg:flex" routerLink="/">
        <img src="/images/zard.svg" alt="logo" class="h-6 dark:invert" />
      </a>
      <div class="flex lg:hidden">
        <z-mobile-nav />
      </div>
      <nav class="hidden flex-1 items-center gap-0 lg:flex">
        @for (path of headerPaths; track path.path) {
          <a z-button zType="ghost" [routerLink]="path.path">
            {{ path.name }}
            @if (!path.available) {
              <z-badge class="px-1 py-0">soon</z-badge>
            }
          </a>
        }
      </nav>

      <aside class="ml-auto flex items-center gap-2 md:flex-1 md:justify-end">
        <div class="hidden w-full flex-1 md:flex md:w-auto md:flex-none">
          <z-doc-researcher #docResearcher />
        </div>

        <z-separator zOrientation="vertical" class="ml-2 hidden h-4! self-center! lg:block" />
        @if (githubData) {
          <a z-button class="flex" zType="ghost" [href]="githubData.url" target="_blank">
            <img [src]="githubData.icon" [alt]="githubData.iconAlt" class="h-4 dark:invert" />
            <span class="text-muted-foreground text-xs tabular-nums">{{ repoStars() }}</span>
          </a>
        }
        <z-separator zOrientation="vertical" class="block h-4! self-center!" />
        <button z-button zType="ghost" zSize="icon" (click)="toggleTheme()">
          <ng-icon name="darkMode" class="size-4.5!" />
          <span class="sr-only">Toggle theme</span>
        </button>
        <!--
          The builder's Get Code on /create (desktop only: a phone has no room for the dialog), a way into the builder
          everywhere else, phones included.
        -->
        @if (onCreate()) {
          <z-separator zOrientation="vertical" class="hidden h-4! self-center! md:block" />
          <button z-button class="hidden md:inline-flex" (click)="openGetCode()">Get Code</button>
        } @else {
          <z-separator zOrientation="vertical" class="block h-4! self-center!" />
          <a z-button routerLink="/create">
            <ng-icon name="lucidePlus" />
            New
          </a>
        }
      </aside>
    </menu>
  </nav>
</header>
