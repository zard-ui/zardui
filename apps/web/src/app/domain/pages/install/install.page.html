@if (installGuide) {
  <z-content [title]="installGuide.title" [navigationConfig]="navigationConfig" [activeAnchor]="activeAnchor">
    <z-doc-heading
      [title]="installGuide.title"
      [description]="installGuide.description"
      scrollSpyItem="overview"
      id="overview"
    ></z-doc-heading>
    <main class="overflow-hidden transition-all duration-200 ease-in-out">
      <nav class="mb-4 flex gap-4">
        @if (installGuide.cli.length > 0) {
          <button
            class="cursor-pointer text-base"
            (click)="activeTab.set('cli')"
            [class.font-semibold]="activeTab() === 'cli'"
            [class.text-foreground]="activeTab() === 'cli'"
          >
            CLI
          </button>
        }
        @if (installGuide.manual.length > 0) {
          <button
            class="cursor-pointer text-base"
            (click)="activeTab.set('manual')"
            [class.font-semibold]="activeTab() === 'manual'"
            [class.text-foreground]="activeTab() === 'manual'"
          >
            Manual
          </button>
        }
      </nav>
      <section
        class="transition-all"
        [class]="activeTab() === 'manual' ? 'translate-x-0' : ['-translate-x-full', 'sr-only']"
      >
        <z-steps [steps]="installGuide.manual"></z-steps>
      </section>
      <section
        class="transition-all"
        [class]="activeTab() === 'cli' ? 'translate-x-0' : ['translate-x-full', 'sr-only']"
      >
        <z-steps [steps]="installGuide.cli"></z-steps>
        @if (installGuide.existingProject; as existing) {
          <!-- Not a step: it replaces creating the project, so it reads as the alternative, after the path it skips. -->
          <aside class="bg-muted/50 mt-2 space-y-4 rounded-lg border p-6">
            <h2 class="text-primary font-medium">Already have a project?</h2>
            <p>{{ existing.subtitle }}</p>
            <z-code-tabs [data]="existing.codeTabData" />
          </aside>
        }
      </section>
    </main>
  </z-content>
}
