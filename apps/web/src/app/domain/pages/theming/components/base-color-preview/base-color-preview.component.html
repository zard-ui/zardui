<div class="flex flex-col gap-4">
  <div role="group" aria-label="Base color" class="flex flex-wrap gap-2">
    @for (theme of themes; track theme.id) {
      <button
        type="button"
        [attr.aria-pressed]="selected().id === theme.id"
        [class]="
          'focus-visible:outline-ring flex items-center gap-2 rounded-md border px-3 py-1.5 text-sm transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 ' +
          (selected().id === theme.id ? 'bg-accent text-accent-foreground border-ring' : 'hover:bg-muted')
        "
        (click)="select(theme.id)"
      >
        <span
          class="border-border size-3.5 shrink-0 rounded-full border"
          [style.background]="buttonSwatch(theme)"
        ></span>
        {{ theme.label }}
      </button>
    }
  </div>

  <div class="border-border overflow-hidden rounded-lg border">
    <div
      class="bg-background text-foreground flex flex-col gap-5 p-4 sm:p-6"
      [class.dark]="isDark()"
      [style]="scopedStyles()"
    >
      <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
        @for (swatch of swatches(); track swatch.name) {
          <div class="border-border flex flex-col gap-1.5 rounded-md border p-2">
            <span class="border-border h-8 w-full rounded border" [style.background]="swatch.value"></span>
            <code class="text-[11px] leading-tight">--{{ swatch.name }}</code>
            <code class="text-muted-foreground text-[10px] leading-tight break-all">{{ swatch.value }}</code>
          </div>
        }
      </div>
    </div>
  </div>

  @if (activeBlock(); as block) {
    <div z-accordion zType="single" class="w-full">
      <z-accordion-item [zValue]="selected().id" [zTitle]="'Full CSS for ' + selected().label">
        <z-code-block [data]="block" />
      </z-accordion-item>
    </div>
  }
</div>
