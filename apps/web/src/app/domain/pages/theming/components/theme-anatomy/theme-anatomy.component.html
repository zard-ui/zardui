<ol class="border-border flex flex-col rounded-lg border">
  @for (part of parts; track part.id; let last = $last) {
    <li class="flex flex-col gap-2 p-4 sm:p-5" [class.border-b]="!last">
      <code
        class="bg-muted text-foreground w-fit max-w-full overflow-x-auto rounded px-2 py-1 font-mono text-xs whitespace-nowrap sm:text-sm"
      >
        {{ part.snippet }}
      </code>

      <div class="flex flex-col gap-1.5">
        <h3 class="text-sm font-semibold sm:text-base">{{ part.title }}</h3>
        <p class="text-muted-foreground text-xs leading-relaxed sm:text-sm" [innerHTML]="part.reason | inlineCode"></p>
        <p class="text-muted-foreground text-xs leading-relaxed">
          <span class="text-destructive font-medium">Without it:</span>
          <span [innerHTML]="part.breaksWhenMissing | inlineCode"></span>
        </p>
      </div>
    </li>
  }
</ol>
