<div class="grid gap-3 sm:grid-cols-2">
  @for (pair of pairs; track pair.background) {
    <div [class]="'flex flex-col gap-1 rounded-lg p-4 ' + pair.classes">
      <code class="text-sm font-medium">--{{ pair.background }}</code>
      <code class="text-xs opacity-80">--{{ pair.foreground }}</code>
    </div>
  }
</div>
