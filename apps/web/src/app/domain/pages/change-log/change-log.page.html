<z-content
  [navigationConfig]="navigationConfig"
  [activeAnchor]="activeAnchor()"
  scrollSpy
  (scrollSpyChange)="activeAnchor.set($event)"
>
  <!--
    The feed link comes after the description in the markup and is placed beside the title: the page's Markdown
    takes the first paragraph under the title as its description, and that has to be the sentence, not the link.
  -->
  <header class="relative flex flex-col gap-2" id="overview">
    <h1 class="scroll-m-24 pr-20 text-3xl font-semibold tracking-tight sm:text-3xl">Changelog</h1>
    <p class="text-muted-foreground text-[1.05rem] text-balance sm:text-base md:max-w-[80%]">
      Latest updates and announcements.
    </p>
    <a
      z-button
      zType="secondary"
      zSize="sm"
      class="absolute top-1 right-0 shadow-none"
      href="/rss.xml"
      target="_blank"
      rel="noopener"
    >
      <ng-icon name="lucideRss" aria-hidden="true" />
      RSS
    </a>
  </header>

  <div class="w-full flex-1 pb-16 sm:pb-0">
    @for (entry of latest; track entry.meta.id) {
      <article
        class="mb-12 scroll-mt-24 border-b pb-12"
        [id]="entry.meta.id"
        [scrollSpyItem]="entry.meta.id"
        (viewportEnter)="onEntryApproaching(entry)"
      >
        <h2 class="font-heading text-xl font-semibold tracking-tight">
          <a class="underline-offset-4 hover:underline" [routerLink]="['/docs/changelog', entry.meta.slug]">
            {{ entry.meta.month }} - {{ entry.meta.title }}
          </a>
        </h2>
        <z-changelog-entry-body class="mt-6 block" [entry]="entry" [anchorPrefix]="entry.meta.id + '-'" />
      </article>
    }

    @if (older.length > 0) {
      <section id="more-updates" class="mb-24 scroll-mt-24" scrollSpyItem="more-updates">
        <h2 class="font-heading mb-6 text-xl font-semibold tracking-tight">More Updates</h2>
        <div class="grid auto-rows-fr gap-3 sm:grid-cols-2">
          @for (entry of older; track entry.meta.id) {
            <a
              class="bg-surface text-surface-foreground hover:bg-surface/80 flex w-full flex-col rounded-2xl px-4 py-3 transition-colors"
              [routerLink]="['/docs/changelog', entry.meta.slug]"
            >
              <span class="text-muted-foreground text-xs">{{ entry.meta.month }}</span>
              <span class="text-sm font-medium">{{ entry.meta.title }}</span>
            </a>
          }
        </div>
      </section>
    }
  </div>
</z-content>
