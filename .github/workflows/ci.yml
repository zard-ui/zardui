name: ci

on:
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Node v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v5
        with:
          failOnWarnings: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npx nx run-many --target=lint --all --parallel
      - name: Check registry
        run: npm run check:registry
      - name: Check API docs
        run: npm run check:api-docs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # The registry and the component markdown under apps/web/public are generated
      # and committed. A build that changes them means the branch is shipping
      # artifacts that no longer match its own source.
      #
      # `about.md` and `changelog.md` are deliberately not checked: they are converted
      # from pages that fetch sponsors, contributors and releases from GitHub while
      # prerendering, so their content tracks the API and not the branch.
      - name: Check generated artifacts are committed
        run: |
          GENERATED="apps/web/public/r apps/web/public/docs/components apps/web/public/llms.txt apps/web/public/schema.json apps/web/prerender-routes.txt"
          if ! git diff --quiet -- $GENERATED; then
            echo "::error::Generated artifacts are out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- $GENERATED
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs:
      - build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx nx e2e web-e2e
        env:
          CI: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: dist/.playwright/apps/web-e2e/html-report/
          retention-days: 14
