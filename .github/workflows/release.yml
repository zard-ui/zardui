name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual publish)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version bump type (prerelease cuts the next beta; patch/minor/major cut a stable release)'
        required: false
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major
      first_release:
        description: 'First release (ignore existing tags)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Test
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Charizard"
          git config user.email "chari@zardui.com"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Build Libraries
        run: |
          npx nx run zard:build
          npx nx run cli:build
          npx nx run mcp:build

      # A manual run uses the bump it was given. A push keeps cutting betas while the
      # current version is a prerelease, so leaving beta stays a deliberate, manual
      # step; once a stable version is out, the commits since the last release tag
      # decide the bump (fix/perf → patch, feat → minor, `!` → major, docs/chore → none).
      # See scripts/release-bump.cts for why Nx does not compute it itself.
      - name: Resolve version specifier
        id: specifier
        run: |
          CURRENT=$(node -p "require('./packages/cli/package.json').version")
          if [ -n "${{ inputs.version }}" ]; then
            SPECIFIER="${{ inputs.version }}"
          elif [[ "$CURRENT" == *"-"* ]]; then
            SPECIFIER="prerelease"
          else
            SPECIFIER=$(npx tsx scripts/release-bump.cts)
          fi
          if [ "$SPECIFIER" = "prerelease" ]; then PREID="--preid=beta"; else PREID=""; fi
          {
            echo "current=$CURRENT"
            echo "specifier=$SPECIFIER"
            echo "preid=$PREID"
          } >> "$GITHUB_OUTPUT"
          echo "📦 Current version: $CURRENT — bump: $SPECIFIER"

      - name: Release (Dry Run)
        if: ${{ inputs.dry_run == true && steps.specifier.outputs.specifier != 'none' }}
        run: npx nx release ${{ steps.specifier.outputs.specifier }} ${{ steps.specifier.outputs.preid }} ${{ inputs.first_release == true && '--first-release' || '' }} --skip-publish --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Version
        if: ${{ inputs.dry_run != true && steps.specifier.outputs.specifier != 'none' }}
        run: npx nx release version ${{ steps.specifier.outputs.specifier }} ${{ steps.specifier.outputs.preid }} ${{ inputs.first_release == true && '--first-release' || '' }} --git-commit=false --git-tag=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Conventional commits can ask for no bump at all (only docs, chores, CI).
      # Then there is nothing to publish, and every step below is skipped.
      - name: Check for a new version
        id: release
        if: ${{ inputs.dry_run != true }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$VERSION" = "${{ steps.specifier.outputs.current }}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No releasable commits since v$VERSION — nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "🔖 New version: $VERSION"
          fi

      - name: Build Registry
        run: npm run build:registry

      - name: Release Changelog
        if: ${{ inputs.dry_run != true && steps.release.outputs.publish == 'true' }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          npx nx release changelog $VERSION ${{ inputs.first_release == true && '--first-release' || '' }} --git-commit=false --git-tag=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Tag Release
        if: ${{ inputs.dry_run != true && steps.release.outputs.publish == 'true' }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          git add -A
          git commit -m "🔖 chore(release): publish v${VERSION} [skip ci] 🔥"
          git tag -a "v${VERSION}" -m "v${VERSION}"

      - name: Rebuild CLI for Publish
        if: ${{ inputs.dry_run != true && steps.release.outputs.publish == 'true' }}
        run: npx nx run cli:build

      - name: Publish to npm
        if: ${{ inputs.dry_run != true && steps.release.outputs.publish == 'true' }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
          cd packages/cli/dist && npm publish --provenance --access public --tag $TAG

      - name: Push changes
        if: ${{ inputs.dry_run != true && steps.release.outputs.publish == 'true' }}
        run: git push --follow-tags

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true && steps.release.outputs.publish == 'true' }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: ${{ inputs.dry_run != true && steps.release.outputs.publish == 'true' && success() }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "⚠️ DEPLOY_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi

          VERSION=$(node -p "require('./packages/cli/package.json').version")

          # Determine if prerelease
          if [[ "$VERSION" == *"-"* ]]; then
            RELEASE_TYPE="🧪 Pre-release"
            COLOR=16776960  # Yellow
            NPM_TAG="beta"
          else
            RELEASE_TYPE="🚀 Stable Release"
            COLOR=5763719   # Green
            NPM_TAG="latest"
          fi

          # Get commit count since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count ${PREV_TAG}..HEAD)
          else
            COMMIT_COUNT="N/A"
          fi

          # Build Discord webhook payload
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "📦 ZardUI CLI v${VERSION}",
              "description": "${RELEASE_TYPE} published successfully!",
              "color": ${COLOR},
              "fields": [
                {
                  "name": "📋 Version",
                  "value": "\`${VERSION}\`",
                  "inline": true
                },
                {
                  "name": "🏷️ npm Tag",
                  "value": "\`${NPM_TAG}\`",
                  "inline": true
                },
                {
                  "name": "📝 Commits",
                  "value": "${COMMIT_COUNT}",
                  "inline": true
                },
                {
                  "name": "📥 Install",
                  "value": "\`\`\`bash\nnpx zard-cli@${VERSION} init\n\`\`\`",
                  "inline": false
                },
                {
                  "name": "🔗 Links",
                  "value": "[npm](https://www.npmjs.com/package/zard-cli/v/${VERSION}) • [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}) • [Changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Released by ${{ github.actor }} via GitHub Actions"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          curl -s -o /dev/null -w "%{http_code}" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "$DEPLOY_WEBHOOK_URL" | grep -q "204" && echo "✅ Discord notification sent!" || echo "❌ Failed to send Discord notification"
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
